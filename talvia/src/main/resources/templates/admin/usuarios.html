<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios — Panel Admin — Talvia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/shared-css :: links}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin_style.css}">
</head>
<body>

<th:block th:replace="~{fragments/admin-header :: header('usuarios')}"></th:block>

<div class="admin-page-header">
    <div class="admin-page-eyebrow">Panel de administración</div>
    <h1 class="admin-page-title">Usuarios</h1>
    <p class="admin-page-subtitle">Trabajadores y empresas registradas en la plataforma.</p>
</div>

<div class="admin-container">

    <div class="admin-toolbar">
    <input type="text" id="buscar-usuario" class="admin-search-input" placeholder="Buscar por nombre o correo…">
    <div class="admin-toolbar-filters">
        <div class="admin-filter-group">
            <label class="admin-filter-label" for="filtro-rol">Rol</label>
            <select id="filtro-rol" class="filter-select">
                <option value="">Todos los roles</option>
                <option value="TRABAJADOR">Trabajador</option>
                <option value="EMPRESA">Empresa</option>
            </select>
        </div>
        <div class="admin-filter-group">
            <label class="admin-filter-label" for="filtro-estado">Estado</label>
            <select id="filtro-estado" class="filter-select">
                <option value="">Todos los estados</option>
                <option value="true">Activo</option>
                <option value="false">Inactivo</option>
            </select>
        </div>
        <button type="button" class="admin-clear-filters" id="btn-limpiar-filtros-usuarios">Limpiar filtros</button>
    </div>
</div>

    <div class="admin-table-wrapper">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Ciudad</th>
                    <th>Registro</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="usuarios-tbody">
                <tr><td colspan="7" class="admin-table-loading">Cargando usuarios...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination-container" id="paginacion" style="margin-top:20px;"></div>

</div>

<!-- Modal de detalle -->
<div id="modalDetalleUsuario" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="max-width:520px;">
        <h3>Detalle del usuario</h3>
        <div class="detalle-grid" id="detalle-usuario-grid"></div>
        <div style="display:flex; justify-content:flex-end;">
            <button type="button" class="btn-tabla" id="btn-cerrar-detalle-usuario">Cerrar</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/shared/notificaciones.js}"></script>
<script th:src="@{/js/shared/mobile-nav.js}"></script>
<script th:src="@{/js/admin/admin-common.js}"></script>
<script th:src="@{/js/admin/usuarios.js}"></script>
</body>
</html>
