<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración — Panel Admin — Talvia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <th:block th:replace="~{fragments/shared-css :: links}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin_style.css}">
    <!-- Siempre el último -->
    <link rel="stylesheet" th:href="@{/css/shared/responsive.css}">
</head>
<body>

<th:block th:replace="~{fragments/admin-header :: header('configuracion')}"></th:block>

<div class="admin-page-header">
    <div class="admin-page-eyebrow">Panel de administración</div>
    <h1 class="admin-page-title">Configuración</h1>
    <p class="admin-page-subtitle">Ajustes generales del sistema.</p>
</div>

<div class="admin-container">

    <div class="config-form-box">

        <div class="config-field">
            <label>Días para avisar "vacante sin candidatos"</label>
            <input type="number" id="config-dias-sin-candidatos" min="1" max="90" value="15">
            <p class="config-field-hint">La empresa recibe una notificación si su vacante lleva este número de días abierta sin postulaciones.</p>
        </div>

        <div class="config-switch-row">
            <div>
                <div style="font-size:14px; font-weight:600; color:var(--ink);">Verificación de correo obligatoria</div>
                <div class="config-field-hint">Si se desactiva, las cuentas nuevas se activan de inmediato sin confirmar el correo.</div>
            </div>
            <label class="checkbox-label" style="cursor:pointer;">
                <input type="checkbox" id="config-verificacion-obligatoria" checked style="display:none;">
                <span class="checkmark"></span>
            </label>
        </div>

        <button type="button" class="btn-publish" id="btn-guardar-config" style="width:100%; text-align:center; background:var(--ink); color:#fff; margin-top:20px;">
            💾 Guardar configuración
        </button>

    </div>

</div>

<div class="toast" id="toast"></div>

<script th:src="@{/js/shared/notificaciones.js}"></script>
<script th:src="@{/js/shared/mobile-nav.js}"></script>
<script th:src="@{/js/admin/admin-common.js}"></script>
<script th:src="@{/js/admin/configuracion.js}"></script>
</body>
</html>
