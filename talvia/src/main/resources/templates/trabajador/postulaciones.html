<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Postulaciones — Talvia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/variables.css}">
    <link rel="stylesheet" th:href="@{/css/shared/base.css}">
    <link rel="stylesheet" th:href="@{/css/shared/header.css}">
    <link rel="stylesheet" th:href="@{/css/shared/hero.css}">
    <link rel="stylesheet" th:href="@{/css/shared/layout.css}">
    <link rel="stylesheet" th:href="@{/css/shared/filters-pagination.css}">
    <link rel="stylesheet" th:href="@{/css/shared/job-card.css}">
    <link rel="stylesheet" th:href="@{/css/shared/footer.css}">
    <link rel="stylesheet" th:href="@{/css/trabajador/postulaciones_style.css}">
</head>
<body>

<header class="top">
    <div class="top-inner">
        <div class="brand">
            <div class="brand-mark">TV</div>
            <div class="brand-name">Tal<span>via</span></div>
        </div>
        <nav class="top-nav">
            <a th:href="@{/private/trabajador/index}">Inicio</a>
            <a th:href="@{/private/trabajador/index}+'#vacantes'">Vacantes</a>
            <a th:href="@{/private/trabajador/postulaciones}" style="color:#fff; font-weight:600;">Mis Postulaciones</a>
            <a th:href="@{/private/trabajador/perfil}">Mi Perfil</a>
        </nav>
        <button class="btn-publish" style="background: transparent; border: 1px solid #d93838; color: #d93838;" id="logoutBtn">Cerrar Sesión</button>
    </div>
</header>

<section class="hero" style="padding: 48px 40px 60px;">
    <div class="hero-inner">
        <div class="hero-eyebrow">Seguimiento de tus aplicaciones</div>
        <h1 class="hero-title" style="font-size: 34px;">Mis Postulaciones</h1>
        <p class="hero-description">
            Aquí puedes ver todas las vacantes a las que te has postulado y el estado de cada una.
        </p>
    </div>
</section>

<main class="layout" style="grid-template-columns: 1fr; margin-top: -20px;">

    <div class="results-head" style="flex-wrap: wrap; gap: 16px;">
        <div class="results-heading">
            <h2 class="results-title">Historial</h2>
            <span class="results-count" id="resultsCount">Cargando postulaciones...</span>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <input type="text" id="searchInput" class="search-postulaciones-input" placeholder="Buscar por vacante o empresa…">
            <select id="sortSelect" class="sort-select">
                <option value="recientes">Más reciente primero</option>
                <option value="antiguas">Más antigua primero</option>
            </select>
        </div>
    </div>

    <div class="job-list" id="postulacionesList"></div>

</main>

<footer class="footer">
    © 2026 Talvia · Historial de postulaciones
</footer>

<script th:src="@{/js/trabajador/postulaciones.js}"></script>
</body>
</html>
