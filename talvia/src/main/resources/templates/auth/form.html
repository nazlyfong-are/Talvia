<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta — NEXUM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/form_style.css}" />
</head>
<body>

  <div class="register-wrapper" id="register-wrapper">

    <!-- ── PANEL IZQUIERDO (selector de tipo) ── -->
    <div class="type-panel">

      <div class="type-panel-brand">
        <div class="logo-mark"><span>N</span></div>
        <span class="logo-text">NEXUM</span>
      </div>

      <div class="type-panel-heading">
        <p class="type-eyebrow">Nueva cuenta</p>
        <h2>¿Cómo desea<br/>registrarse?</h2>
      </div>

      <div class="type-tabs">
        <button type="button" class="tab-btn active" id="tab-natural">
          <div class="tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div class="tab-text">
            <strong>Persona Natural</strong>
            <span>Ciudadano regular</span>
          </div>
          <div class="tab-arrow">›</div>
        </button>

        <button type="button" class="tab-btn" id="tab-juridica">
          <div class="tab-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="7" width="20" height="14" rx="2"/>
              <path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
              <line x1="12" y1="12" x2="12" y2="16"/>
              <line x1="10" y1="14" x2="14" y2="14"/>
            </svg>
          </div>
          <div class="tab-text">
            <strong>Persona Jurídica</strong>
            <span>Empresa / corporativo</span>
          </div>
          <div class="tab-arrow">›</div>
        </button>
      </div>

      <p class="type-panel-footer">
        ¿Ya tienes cuenta?
        <a th:href="@{/public/login}" href="/public/login">Inicia sesión</a>
      </p>

    </div>

    <!-- ── PANEL DERECHO (formulario) ── -->
    <div class="form-panel">
      <div class="form-scroll">

        <div class="form-header">
          <div class="mode-pill">
            <span class="mode-pill-dot"></span>
            <span id="mode-pill-label">Persona Natural</span>
          </div>
          <h1 id="register-title">Crear cuenta</h1>
          <p id="register-subtitle">Complete todos los campos para registrar su usuario.</p>
        </div>

        <form id="registration-form" novalidate>

          <!-- ── SECCIÓN: DATOS PERSONALES (solo Natural) ── -->
          <div class="form-section block-natural">
            <p class="section-label">Datos personales</p>
            <div class="fields-grid">

              <div class="field-group full-width">
                <label for="nombres">Nombres</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                  <input type="text" id="nombres" name="nombres" placeholder="Ej: Juan Carlos" required />
                </div>
              </div>

              <div class="field-group">
                <label for="primer-apellido">Primer apellido</label>
                <div class="input-wrapper">
                  <input type="text" id="primer-apellido" name="primer-apellido" placeholder="Ej: Pérez" required />
                </div>
              </div>

              <div class="field-group">
                <label for="segundo-apellido">Segundo apellido</label>
                <div class="input-wrapper">
                  <input type="text" id="segundo-apellido" name="segundo-apellido" placeholder="Ej: Rodríguez" required />
                </div>
              </div>

              <div class="field-group">
                <label for="tipo-documento">Tipo de documento</label>
                <div class="input-wrapper select-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="13" y2="13"/>
                  </svg>
                  <select id="tipo-documento" name="tipo-documento" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                  </select>
                </div>
              </div>

              <div class="field-group">
                <label for="num-documento">Número de documento</label>
                <div class="input-wrapper">
                  <input type="text" id="num-documento" name="num-documento" placeholder="Sin puntos ni comas" required />
                </div>
              </div>

            </div>
          </div>

          <!-- ── SECCIÓN: DATOS EMPRESA (solo Jurídica) ── -->
          <div class="form-section block-juridica">
            <p class="section-label">Datos de la empresa</p>
            <div class="fields-grid">

              <div class="field-group full-width">
                <label for="razon-social">Razón social</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                  </svg>
                  <input type="text" id="razon-social" name="razon-social" placeholder="Ej: Industrias Globales SAS" />
                </div>
              </div>

              <div class="field-group">
                <label for="figura-legal">Figura legal</label>
                <div class="input-wrapper select-wrapper">
                  <select id="figura-legal" name="figura-legal">
                    <option value="" disabled selected>Seleccione la figura</option>
                    <option value="SAS">S.A.S</option>
                    <option value="LTDA">Ltda</option>
                    <option value="SA">S.A</option>
                    <option value="EU">E.U</option>
                  </select>
                </div>
              </div>

              <div class="field-group">
                <label for="nit">NIT</label>
                <div class="input-wrapper">
                  <input type="text" id="nit" name="nit" placeholder="Ej: 900123456-1" />
                </div>
              </div>

            </div>
          </div>

          <!-- ── SECCIÓN: DATOS DE ACCESO (ambos tipos) ── -->
          <div class="form-section block-comun">
            <p class="section-label">Datos de contacto y acceso</p>
            <div class="fields-grid">

              <div class="field-group">
                <label for="correo">Correo electrónico</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                  </svg>
                  <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" required />
                </div>
              </div>

              <div class="field-group">
                <label for="telefono">Teléfono</label>
                <div class="input-wrapper">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                  </svg>
                  <input type="tel" id="telefono" name="telefono" placeholder="Ej: 3001234567" required />
                </div>
              </div>

              <div class="field-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper has-toggle">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                  <input type="password" id="password" name="password" placeholder="Mín. 8 caracteres, 1 mayúscula, 1 número" required />
                  <button type="button" class="toggle-password" id="togglePwd1" aria-label="Mostrar contraseña">
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
              </div>

              <div class="field-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <div class="input-wrapper has-toggle">
                  <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                  <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita la contraseña" required />
                  <button type="button" class="toggle-password" id="togglePwd2" aria-label="Mostrar contraseña">
                    <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                      <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                  </button>
                </div>
              </div>

            </div>
          </div>

          <!-- ── ACCIONES ── -->
          <div class="form-actions">
            <button type="submit" class="btn-primary" id="register-btn">
              <span class="btn-text">Crear cuenta</span>
              <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script th:src="@{/js/form.js}"></script>
</body>
</html>
