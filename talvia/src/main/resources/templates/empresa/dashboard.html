<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Empresa — Talvia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/variables.css}">
    <link rel="stylesheet" th:href="@{/css/shared/base.css}">
    <link rel="stylesheet" th:href="@{/css/shared/header.css}">
    <link rel="stylesheet" th:href="@{/css/shared/footer.css}">
    <link rel="stylesheet" th:href="@{/css/empresa/index_style.css}">
</head>
<body>

    <header class="top">
        <div class="top-inner">
            <div class="brand">
                <div class="brand-mark">TV</div>
                <div class="brand-name">Tal<span>via</span> <small style="font-size: 11px; color: var(--gold);">(Empresas)</small></div>
            </div>

            <nav style="display: flex; gap: 10px;">
                <button class="emp-nav-btn active" data-target="sec-inicio">📥 Inicio (Candidatos)</button>
                <button class="emp-nav-btn" data-target="sec-publicar">➕ Publicar Vacante</button>
                <button class="emp-nav-btn" data-target="sec-perfil">🏢 Perfil Empresa</button>
            </nav>

            <button class="btn-publish" style="background: transparent; border: 1px solid #d93838; color: #d93838;" id="logoutBtn">Cerrar Sesión</button>
        </div>
    </header>

    <main class="layout" style="grid-template-columns: 1fr; max-width: 1000px; margin: 30px auto;">
        <div th:replace="~{empresa/fragments/seccion-inicio :: contenido}"></div>
        <div th:replace="~{empresa/fragments/seccion-publicar :: contenido}"></div>
        <div th:replace="~{empresa/fragments/seccion-perfil :: contenido}"></div>
    </main>

    <div th:replace="~{empresa/fragments/modal-cv :: contenido}"></div>

    <div class="toast" id="toast"></div>

    <script th:src="@{/js/empresa/dashboard-common.js}"></script>
    <script th:src="@{/js/empresa/dashboard-perfil.js}"></script>
    <script th:src="@{/js/empresa/dashboard-vacantes.js}"></script>
    <script th:src="@{/js/empresa/dashboard-postulaciones.js}"></script>
</body>
</html>
