<div th:fragment="contenido">
    <section id="sec-publicar" class="tab-content">
        <div class="form-box">
            <h2 style="font-family: 'Fraunces', serif; color: var(--gold-deep); margin-bottom: 8px;"
                id="form-vacante-titulo">➕ Publicar Nueva Oferta Laboral</h2>
            <p style="color: var(--slate); font-size: 13px; margin-bottom: 24px;" id="form-vacante-subtitulo">La oferta
                se publicará automáticamente con el nombre y logo actual de tu empresa.</p>

            <form id="form-publicar-vacante">
                <div class="form-group">
                    <input type="hidden" id="vac-editando-id" value="">
                    <label>Título de la Vacante</label>
                    <input type="text" id="vac-titulo" placeholder="Ej: Senior Frontend Developer" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Ubicación (Ciudad)</label>
                        <select id="vac-ubicacion" required>
                            <option value="" disabled selected>Seleccione una ciudad</option>
                            <option value="Bogotá">Bogotá</option>
                            <option value="Medellín">Medellín</option>
                            <option value="Cali">Cali</option>
                            <option value="Barranquilla">Barranquilla</option>
                            <option value="Cartagena">Cartagena</option>
                            <option value="Cúcuta">Cúcuta</option>
                            <option value="Bucaramanga">Bucaramanga</option>
                            <option value="Pereira">Pereira</option>
                            <option value="Santa Marta">Santa Marta</option>
                            <option value="Ibagué">Ibagué</option>
                            <option value="Manizales">Manizales</option>
                            <option value="Pasto">Pasto</option>
                            <option value="Neiva">Neiva</option>
                            <option value="Villavicencio">Villavicencio</option>
                            <option value="Armenia">Armenia</option>
                            <option value="Valledupar">Valledupar</option>
                            <option value="Montería">Montería</option>
                            <option value="Sincelejo">Sincelejo</option>
                            <option value="Popayán">Popayán</option>
                            <option value="Tunja">Tunja</option>
                            <option value="Riohacha">Riohacha</option>
                            <option value="Quibdó">Quibdó</option>
                            <option value="Yopal">Yopal</option>
                            <option value="Remoto">Remoto (sin ciudad específica)</option>
                            <option value="otra">Otra ciudad...</option>
                        </select>
                        <input type="text" id="vac-ubicacion-otra" placeholder="Escriba la ciudad" class="oculto"
                            style="margin-top:8px;">
                    </div>

                    <div class="form-group">
                        <label>Área / Profesión</label>
                        <select id="vac-area" required>
                            <option value="tecnologia">Tecnología & IT</option>
                            <option value="ventas">Ventas y Comercial</option>
                            <option value="logistica">Logística y Transporte</option>
                            <option value="finanzas">Finanzas y Contabilidad</option>
                            <option value="salud">Salud y Medicina</option>
                            <option value="administracion">Administración</option>
                            <option value="marketing">Marketing y Publicidad</option>
                            <option value="ingenieria">Ingeniería</option>
                            <option value="educacion">Educación</option>
                            <option value="legal">Legal y Jurídico</option>
                            <option value="recursos-humanos">Recursos Humanos</option>
                            <option value="construccion">Construcción</option>
                            <option value="atencion-cliente">Atención al cliente</option>
                            <option value="produccion">Producción y Manufactura</option>
                            <option value="diseno">Diseño y Artes</option>
                            <option value="gastronomia">Gastronomía y Turismo</option>
                        </select>
                    </div>
                </div>

                <!-- SALARIO ESTRUCTURADO -->
                <div class="form-group">
                    <label>Sueldo Ofrecido</label>
                    <div style="display:grid; grid-template-columns: 1fr 1fr 100px 140px; gap:8px;">
                        <input type="text" inputmode="numeric" id="vac-monto-min" placeholder="Monto mínimo" required>
                        <input type="text" inputmode="numeric" id="vac-monto-max" placeholder="Monto máximo (opcional)">
                        <select id="vac-moneda">
                            <option value="COP">COP</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="MXN">MXN</option>
                        </select>
                        <select id="vac-periodicidad">
                            <option value="MENSUAL">Mensual</option>
                            <option value="POR_HORA">Por hora</option>
                            <option value="POR_PROYECTO">Por proyecto</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Años de Experiencia Mínima</label>
                        <select id="vac-experiencia" required>
                            <option value="0">Sin experiencia requerida</option>
                            <option value="1">1+ año</option>
                            <option value="2">2+ años</option>
                            <option value="3">3+ años</option>
                            <option value="4">4+ años</option>
                            <option value="5">5+ años</option>
                            <option value="7">7+ años</option>
                            <option value="10">10+ años</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel Educativo Mínimo (opcional)</label>
                        <select id="vac-nivel-educativo">
                            <option value="">No especificado</option>
                            <option value="BACHILLER">Bachiller</option>
                            <option value="TECNICO">Técnico</option>
                            <option value="TECNOLOGO">Tecnólogo</option>
                            <option value="PROFESIONAL">Profesional</option>
                            <option value="ESPECIALIZACION">Especialización</option>
                            <option value="MAESTRIA">Maestría</option>
                            <option value="DOCTORADO">Doctorado</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Modalidad</label>
                        <select id="vac-modalidad" required>
                            <option value="presencial">Presencial</option>
                            <option value="remoto">Remoto</option>
                            <option value="hibrido">Híbrido</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel del Cargo</label>
                        <select id="vac-nivel" required>
                            <option value="entrada">Nivel de entrada / Sin experiencia</option>
                            <option value="intermedio">Nivel intermedio / Con experiencia</option>
                            <option value="avanzado">Avanzado / Especializado</option>
                            <option value="coordinacion">Coordinación / Supervisión</option>
                            <option value="gerencia">Gerencia / Dirección</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descripción del Rol</label>
                    <textarea id="vac-descripcion" rows="3"
                        placeholder="Describe brevemente las responsabilidades del puesto..." required></textarea>
                </div>

                <!-- REQUISITOS ESTRUCTURADOS -->
                <div class="form-group">
                    <label>Requisitos del Candidato</label>
                    <div id="requisitos-container"></div>
                    <button type="button" id="add-requisito" class="btn-login"
                        style="background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:8px 14px; font-size:13px; margin-top:8px;">+
                        Agregar requisito</button>
                </div>

                <div class="form-group">
                    <label>¿Qué Ofrecemos? (Beneficios)</label>
                    <textarea id="vac-beneficios" rows="3"
                        placeholder="Ej: Horario flexible, Seguro médico, Capacidad de crecimiento..."
                        required></textarea>
                </div>

                <div style="display:flex; gap:10px;">
                    <button type="submit" class="btn-login" id="btn-publicar"
                        style="background: var(--gold); color: var(--ink); font-weight: 600; flex:1; padding: 12px;">Publicar
                        Oferta Ahora</button>
                    <button type="button" id="btn-cancelar-edicion" class="btn-login oculto"
                        style="background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 12px 20px;">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="form-box" style="margin-top: 24px;">
            <h3 style="font-family: 'Fraunces', serif; color: var(--ink); margin-bottom: 4px; font-size: 18px;">📋 Mis
                Vacantes Publicadas</h3>
            <p style="color: var(--slate); font-size: 13px; margin-bottom: 20px;">Estas son las ofertas activas de tu
                empresa. Puedes eliminarlas cuando ya no estén disponibles.</p>
            <div id="lista-mis-vacantes" style="display: grid; gap: 12px;"></div>
        </div>
    </section>
</div>
