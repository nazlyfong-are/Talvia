<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocurrió un error — Talvia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shared/variables.css}">
    <link rel="stylesheet" th:href="@{/css/shared/error_style.css}">
</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-code" th:text="${status}" style="color:var(--ink);">?</div>
            <h1 class="error-title">Ocurrió un error inesperado</h1>
            <p class="error-subtitle" th:text="${error}">Algo no salió como esperábamos.</p>
            <a th:href="@{/}" class="btn-primary">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
