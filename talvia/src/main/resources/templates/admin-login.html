<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrador - Talvia</title>
</head>
<body>
    <h1>Acceso exclusivo de administrador</h1>
    <form action="/admin/login" method="post">
        <label>Usuario:
            <input type="text" name="username" required>
        </label><br><br>

        <label>Contraseña:
            <input type="password" name="password" required>
        </label><br><br>

        <button type="submit">Entrar</button>
    </form>
</body>
</html>
