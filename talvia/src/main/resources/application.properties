spring.application.name=talvia
logging.level.org.springframework.security=DEBUG
spring.profiles.active=dev
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=25


spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.keepalive-time=240000
spring.datasource.hikari.max-lifetime=1700000

talvia.modelo.tipo=onnx
talvia.modelo.horas-mes=160
talvia.modelo.tasa.usd=4000
talvia.modelo.tasa.eur=4400
talvia.modelo.tasa.mxn=220